<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1A12"/>
      <stop offset="100%" stop-color="#112218"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#52B788" stroke-width="0.4" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent bar -->
  <rect x="80" y="120" width="3" height="390" fill="url(#accent-grad)" rx="1.5"/>

  <!-- Glow -->
  <ellipse cx="900" cy="315" rx="320" ry="260" fill="#52B788" opacity="0.04"/>

  <!-- Name -->
  <text x="120" y="240"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="88"
    font-weight="700"
    fill="#E8F0E5"
    letter-spacing="-3"
  >LUKA SALVO</text>

  <!-- Role tags -->
  <text x="122" y="300"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="22"
    font-weight="600"
    fill="#52B788"
    letter-spacing="4"
  >ADMIN SYS  ·  CYBERSÉCURITÉ  ·  DEVOPS</text>

  <!-- Separator -->
  <rect x="120" y="330" width="480" height="1" fill="#52B788" opacity="0.2"/>

  <!-- Description -->
  <text x="120" y="375"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="18"
    fill="#A8C8B0"
    letter-spacing="0.5"
  >Futur ingénieur IMT Nord Europe</text>
  <text x="120" y="405"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="18"
    fill="#A8C8B0"
    letter-spacing="0.5"
  >Recherche alternance 3 ans · 2026 → 2029</text>

  <!-- Available badge -->
  <rect x="120" y="440" width="240" height="36" rx="18" fill="#52B788" fill-opacity="0.12" stroke="#52B788" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="144" cy="458" r="5" fill="#52B788"/>
  <text x="158" y="463"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="13"
    font-weight="700"
    fill="#52B788"
    letter-spacing="1.5"
  >DISPONIBLE · SEPT 2026</text>

  <!-- Right — avatar block -->
  <rect x="920" y="195" width="200" height="200" rx="12" fill="#152A1E" stroke="#52B788" stroke-width="1" stroke-opacity="0.2"/>
  <text x="1020" y="315"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="72"
    font-weight="700"
    fill="#52B788"
    text-anchor="middle"
    letter-spacing="-2"
  >LS</text>

  <!-- Bottom domain hint -->
  <text x="120" y="560"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="15"
    fill="#3D5A44"
    letter-spacing="1"
  >portfolio · github.com/LukaSalvo</text>
</svg>
